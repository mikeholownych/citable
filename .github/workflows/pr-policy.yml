name: PR policy

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    if: github.event.pull_request.state == 'open'
    name: PR structure and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'

      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt

      - name: Validate PR contract
        run: node scripts/validate-pr.js changed-files.txt

      - name: Validate release PR version
        if: startsWith(github.head_ref, 'release/v')
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: node scripts/release-process.js validate "${RELEASE_BRANCH#release/v}"
