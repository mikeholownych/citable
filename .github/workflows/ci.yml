name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build distribution
        run: npm run build:dist
      
      - name: Run tests
        run: npm test
      
      - name: Verify distribution
        run: |
          test -d dist/universal
          test -f dist/universal/manifest.json
          node -e "require('./dist/universal/manifest.json')"
      
      - name: Test CLI
        run: |
          node cli/bin/citable.js --version
          node cli/bin/citable.js help

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check schemas
        run: npm run validate:schemas
      
      - name: Check documentation
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f docs/architecture/adr-001-architecture.md
          test -f docs/architecture/traceability-matrix.md
          test -f docs/known-limitations.md
          node scripts/validate-community.js
